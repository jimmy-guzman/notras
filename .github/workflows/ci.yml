name: ci

on: [pull_request]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  code_check:
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Setup Repository
        uses: actions/checkout@v4

      - name: 📦 Install
        uses: ./.github/actions/install

      - name: ✂️ Knip
        run: pnpm knip

      - name: 🚨 Check
        run: pnpm check

      - name: 🏷️ Typecheck
        run: pnpm typecheck

      - name: ✅ Coverage
        run: pnpm coverage

      - name: 🏗 Build
        run: pnpm build:web

  rust:
    # Both targets, because a platform-gated arm compiles on one and not the
    # other. release.yml's check job runs on Linux, so a macOS-only gate here
    # lets that class of error reach a tag: `RunEvent::Reopen` did.
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    needs: code_check

    steps:
      - name: 🏗 Setup Repository
        uses: actions/checkout@v4

      # macOS needs none of these; the tauri crate links webkit2gtk through
      # pkg-config, which is why release.yml installs the same set.
      - name: 🐧 Setup Linux Deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 🦀 Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # --locked is the `D49` guard, and it belongs on the pull request: a bare
      # `cargo test` repairs a stale Cargo.lock in place and passes, so the
      # mistake would only surface in release.yml after main is tagged.
      - name: 🧪 Rust Tests
        working-directory: src-tauri
        run: cargo test --locked
