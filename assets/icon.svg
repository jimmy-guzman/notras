    <linearGradient id="cyan" x1="0" y1=".5" x2=".225" y2=".5"><stop stop-color="#6193a1" stop-opacity=".2"/><stop offset="1" stop-color="#6193a1" stop-opacity="0"/></linearGradient>
    <linearGradient id="pink" x1="1" y1=".5" x2=".775" y2=".5"><stop stop-color="#a76e94" stop-opacity=".2"/><stop offset="1" stop-color="#a76e94" stop-opacity="0"/></linearGradient>
