[package]
name = "notras"
# Frozen, and not the app version. `tauri.conf.json` reads the version out of
# `package.json`, which release-please owns. No release-please updater bumps
# `Cargo.toml` and `Cargo.lock` together, so bumping this alone strands the
# lockfile and breaks `cargo build --locked` (`D49`).
version = "0.0.0"
description = "Write another note."
authors = ["jimmy-guzman"]
license = "MIT"
edition = "2021"

[lib]
name = "notras_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
log = "0.4"
notify = "8"
notify-debouncer-full = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [
  "image-png",
  "protocol-asset",
  "tray-icon",
] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
# Already in the tree through tauri-plugin-updater; named here for
# `NamedTempFile`, which is what makes a note save atomic. Preferred over
# `atomic-write-file`, which is purpose-built but would be a genuinely new
# crate, unproven against the `1.98.0` pin, and pre-1.0.
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# Already in the tree through tao and wry; named here to reach
# prefersCompactControlSizeMetrics, which is what keeps the window buttons at
# their pre-Tahoe size.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSView",
  "NSWindow",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
