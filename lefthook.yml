pre-commit:
  jobs:
    - run: pnpm fix
      stage_fixed: true
    - run: pnpm knip
    - name: rust-format
      glob:
        - "src-tauri/*.rs"
        - "src-tauri/**/*.rs"
        - "crates/**/*.rs"
        - "rustfmt.toml"
        - ".rustfmt.toml"
        - "src-tauri/rustfmt.toml"
        - "src-tauri/.rustfmt.toml"
        - "rust-toolchain.toml"
      run: cargo fmt --all -- --check
