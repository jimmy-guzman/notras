name: CI

on:
  pull_request:
  # For the cache, not the signal: a run writes into the refs/heads/main scope
  # only when its own ref is main, and every pull request reads from there.
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: ref to check out; empty checks out the triggering ref
        type: string
        default: ""
      # Inverted because a workflow_call input is not populated on push or
      # pull_request and its default does not apply there. Absent has to mean
      # "write the cache", or every direct run would read falsy and stop.
      skip-cache:
        description: stand down from writing the shared caches
        type: boolean
        default: false

# A called workflow resolves `github.workflow` to its caller, so a group built
# from it alone collides with the caller's and cancels it. The handed ref
# keys a called run apart.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ !inputs.ref }}

permissions: {}

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: 📥 Setup Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: 🏗️ Setup Node
        uses: ./.github/actions/setup-node
        with:
          save-cache: ${{ !inputs.skip-cache && github.ref == 'refs/heads/main' }}

      - name: ✂️ Knip
        run: pnpm knip

      - name: 🏷️ Typecheck
        run: pnpm typecheck

      - name: 🚨 Check
        run: pnpm check

      - name: ✅ Coverage
        run: pnpm coverage

      - name: 🔨 Build Web
        run: pnpm build:web

  rust:
    # A platform-gated arm compiles on one and not the other, and a Linux-only
    # gate lets that reach a tag: `RunEvent::Reopen` did.
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: 📥 Setup Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      # Two packages, not release.yml's four: this job bundles nothing.
      - name: 🐧 Setup Linux Deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: 🏗️ Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ !inputs.skip-cache && github.ref == 'refs/heads/main' }}
          shared-key: test

      # --locked is the `D49` guard.
      - name: 🧪 Rust Tests
        working-directory: src-tauri
        run: cargo test --locked

  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: 📥 Setup Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      # This image carries shellcheck and pyflakes; a wrapper action would not.
      - name: 🧹 Actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

      # The default mode uploads SARIF and never fails the job, which needs a
      # code-scanning ruleset to block anything. This is a gate.
      - name: 🌈 Zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
