allowBuilds:
  # The native smoke driver embeds WebDriver and never launches Edge or Firefox.
  edgedriver: false
  esbuild: true
  geckodriver: false
  lefthook: true
  msgpackr-extract: true
autoInstallPeers: false
color: always
engineStrict: true
minimumReleaseAgeExclude:
  - "@pierre/highlights@0.6.0"
patchedDependencies:
  "@tiptap/core": patches/@tiptap__core.patch
  "@tiptap/markdown": patches/@tiptap__markdown.patch
  "@tiptap/react": patches/@tiptap__react.patch
permissions:
  "@tanstack/react-hotkeys":
    skills: true
  ultracite:
    skills: true
saveExact: true
