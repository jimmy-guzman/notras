allowBuilds:
  # The native smoke driver embeds WebDriver and never launches Edge or Firefox.
  edgedriver: false
  esbuild: true
  geckodriver: false
  lefthook: true
  msgpackr-extract: true
autoInstallPeers: false
color: always
engineStrict: true
patchedDependencies:
  "@tiptap/markdown": patches/@tiptap__markdown.patch
  "@tiptap/react": patches/@tiptap__react.patch
permissions:
  "@tanstack/react-hotkeys":
    skills: true
  ultracite:
    skills: true
saveExact: true
