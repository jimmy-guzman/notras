<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <!--
      The webview paints its own canvas before styles.css exists, and without a
      color-scheme it paints white. The meta tag is read before the document is
      drawn; the CSS property alone cannot help, because honouring it waits on
      the stylesheet. Both backgrounds restate --background from src/styles.css,
      and src/styles.spec.ts fails if the copies drift.
    -->
    <meta content="dark light" name="color-scheme">
    <style>
    :root {
      color-scheme: dark light;
      background-color: #191b1d;
    }
    @media (prefers-color-scheme: light) {
      :root {
        background-color: #f7f8fa;
      }
    }
    </style>
    <link
      href="/favicon-dark.png"
      media="(prefers-color-scheme: dark)"
      rel="icon"
      type="image/png"
    >
    <link
      href="/favicon-light.png"
      media="(prefers-color-scheme: light)"
      rel="icon"
      type="image/png"
    >
    <link href="/apple-touch-icon.png" rel="apple-touch-icon">
    <title>notras</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
