name: CI

on:
  pull_request:
  # For the cache, not the signal: a run writes into the refs/heads/main scope
  # only when its own ref is main, and every pull request reads from there.
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: ref to check out; empty checks out the triggering ref
        type: string
        default: ""
      # Inverted because a workflow_call input is not populated on push or
      # pull_request and its default does not apply there. Absent has to mean
      # "write the cache", or every direct run would read falsy and stop.
      skip-cache:
        description: stand down from writing the shared caches
        type: boolean
        default: false

# A called workflow resolves `github.workflow` to its caller, so a group built
# from it alone collides with the caller's and cancels it. The handed ref
# keys a called run apart.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.head_ref || github.ref }}
  cancel-in-progress: ${{ !inputs.ref }}

permissions: {}

jobs:
  typescript:
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: 📥 Setup Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: 🏗️ Setup Node
        uses: $/.github/actions/setup-node
        with:
          save-cache: ${{ !inputs.skip-cache && github.ref == 'refs/heads/main' }}

      - name: ✂️ Knip
        run: pnpm knip

      - name: 🚨 Check
        run: pnpm check

      - name: ✅ Coverage
        run: pnpm coverage

      - name: 🔨 Build Web
        run: pnpm build:web

  rust:
    # A platform-gated arm compiles on one and not the other, and a Linux-only
    # gate lets that reach a tag: `RunEvent::Reopen` did.
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: 📥 Setup Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      # Two packages, not release.yml's four: this job bundles nothing.
      - name: 🐧 Setup Linux Deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: 🏗️ Setup Rust
        uses: $/.github/actions/setup-rust
        with:
          save-cache: ${{ !inputs.skip-cache && github.ref == 'refs/heads/main' }}
          shared-key: test

      - name: Install Rust gate tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-machete@0.9.2,cargo-llvm-cov@0.9.1
          fallback: none

      - name: Check unused Rust dependencies
        if: runner.os == 'Linux'
        run: cargo machete

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Setup Node for bindings
        if: runner.os == 'Linux'
        uses: $/.github/actions/setup-node
        with:
          save-cache: ${{ !inputs.skip-cache && github.ref == 'refs/heads/main' }}

      - name: Check native binding drift
        if: runner.os == 'Linux'
        run: pnpm bindings:check

      - name: Test the standalone engine
        run: cargo test -p notras-core --locked

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: 🧪 Rust Tests
        run: cargo test --workspace --locked

      - name: Rust coverage report
        id: coverage
        if: runner.os == 'Linux'
        run: scripts/check-rust-coverage.sh

      - name: Upload Rust coverage
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          path: target/coverage/
          if-no-files-found: error

  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: 📥 Setup Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      # The fork's own action pins its image by digest only on the commit under
      # the moving `v1` tag, so a SHA pin there would name a moving ref and trip
      # zizmor's ref-version-mismatch on each fork release. The image pins itself.
      - name: 🧹 Actionlint
        uses: docker://ghcr.io/kjanat/actionlint:1.17.0@sha256:d484cccadf56b6a356466ade9af4c8e05c5dce1badaf0a9ecd0d7639d68d9c92
        with:
          args: -color

      # The default mode uploads SARIF and never fails the job, which needs a
      # code-scanning ruleset to block anything. This is a gate.
      - name: 🌈 Zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
