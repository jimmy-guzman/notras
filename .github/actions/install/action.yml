name: Install
description: Install everything for the repo

runs:
  using: composite
  steps:
    - name: 🏗 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: 🏗 Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: 🗃️ Get pnpm Store Directory
      id: pnpm-cache
      shell: bash
      run: echo "store_path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    # Split restore from save because actions/cache has no save-if, and only a
    # run whose ref is main writes a cache other runs can read. A PR branch
    # saving here just consumes the repo's 10GB budget and evicts the
    # main-scoped entry every PR actually restores from.
    - name: 🏗 Restore pnpm Store Cache
      id: pnpm-store
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.pnpm-cache.outputs.store_path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: 📦 Install Deps
      run: pnpm install --frozen-lockfile
      shell: bash

    # Skipped on an exact hit: the store is already what this key names.
    - name: 💾 Save pnpm Store Cache
      if: github.ref == 'refs/heads/main' && steps.pnpm-store.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.pnpm-cache.outputs.store_path }}
        key: ${{ steps.pnpm-store.outputs.cache-primary-key }}
