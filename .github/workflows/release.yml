name: Release

on:
  push:
    branches: [main]
  # Redrive lever. GitHub blocks GITHUB_TOKEN from creating a release targeting
  # a commit whose workflow files differ from the run's own, so a stranded
  # release cannot be re-driven through the push path; this can.
  workflow_dispatch:
    inputs:
      tag:
        description: "existing release tag to republish (e.g. v0.2.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: 🚀 Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # An empty tag reads as "no release" downstream and would skip the build.
      - name: 🧾 Assert Release Outputs
        if: steps.release.outputs.releases_created == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::release created but tag_name is empty"
            exit 1
          fi

  # The release pull request is opened by GITHUB_TOKEN, which never fires
  # pull_request, so the tagged tree has had no gate run against it. Same
  # workflow a pull request runs, handed the tag.
  gate:
    needs: release-please
    # `!= 'failure'` rather than `== 'success'` because the dispatch path skips
    # release-please. An empty `ref` makes checkout fall back to the triggering
    # ref, certifying main instead of the tag.
    if: ${{ !cancelled() && needs.release-please.result != 'failure' && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.released == 'true') }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      skip-cache: true

  build:
    # Not `needs: gate`. gate declares no outputs, so the edge was ordering
    # alone and cost ~204s of a ~740s release. verify needs both, and it is the
    # only thing that undrafts the release, so nothing ships ungated.
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result != 'failure' && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.released == 'true') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Legs run concurrently and tauri-action assembles latest.json by reading
      # the existing asset, merging and re-uploading, which interleaves across
      # them (tauri-action#1270, fixed in the pinned v1.0.0). Convergence is
      # probabilistic, so verify asserts the result.
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: 📥 Setup Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: 🐧 Setup Linux Deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # The ubuntu leg keys the pnpm store on `runner.os`, the same key the
      # direct run writes on this push. CI owns it.
      - name: 🏗️ Setup Node
        uses: ./.github/actions/setup-node
        with:
          save-cache: false

      - name: 🏗️ Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: release
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 🆔 Resolve Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          id=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          if [ -z "$id" ]; then
            echo "::error::could not resolve a release id for $TAG"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # Tauri reads these with var_os, so an unset secret arrives as Some("")
      # and reads as configured, and notarize_auth() would then notarize with an
      # empty Apple ID. All six or none.
      - name: 🔏 Setup Apple Signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          names="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"
          missing=""
          for name in $names; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "building unsigned; not configured:$missing"
            exit 0
          fi
          # Heredoc form, not KEY=VALUE: base64 wraps at 76 columns without
          # -w0, and a multiline value breaks GITHUB_ENV parsing outright.
          for name in $names; do
            {
              echo "$name<<__EOF_$name"
              printf '%s\n' "${!name}"
              echo "__EOF_$name"
            } >> "$GITHUB_ENV"
          done

      - name: 🔨 Build Bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Not optional: without it `createUpdaterArtifacts` emits no .sig
          # files and latest.json is unverifiable.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.release.outputs.id }}
          args: ${{ matrix.args }}
          # Upstream's backoff is a flat 1-10s sleep, not exponential, and its
          # own comment calls that provisional. Attempts are the cheap half.
          retryAttempts: 5

  verify:
    needs: [release-please, gate, build]
    # Both, not either: build does not wait on gate, so this is where the two
    # meet. `!cancelled()` is load-bearing, because the implicit success() reads
    # the dispatch path's skipped release-please as a failure and would leave a
    # redrive that builds everything and publishes nothing.
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 🔍 Verify Assets
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$assets"
          for pattern in '\.dmg$' '\.AppImage$' '\.deb$' '\.exe$|\.msi$'; do
            if ! printf '%s\n' "$assets" | grep -qE "$pattern"; then
              echo "::error::no release asset matches $pattern"
              exit 1
            fi
          done

      - name: 🔍 Verify Updater Manifest
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern latest.json --dir manifest
          cat manifest/latest.json
          for key in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            if ! jq -e --arg k "$key" \
              '(.platforms[$k].signature // "") != "" and (.platforms[$k].url // "") != ""' \
              manifest/latest.json > /dev/null; then
              echo "::error::latest.json has no usable $key entry"
              exit 1
            fi
          done

      - name: 🔐 Write Checksums
        run: |
          set -euo pipefail
          mkdir -p release-assets && cd release-assets
          gh release download "$TAG" --clobber
          # A redrive re-downloads the previous sums file; never hash it.
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber

      # release-please creates it drafted, so nothing was downloadable yet.
      - name: 📣 Publish Release
        run: gh release edit "$TAG" --draft=false

  homebrew:
    needs: [release-please, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # Separate from verify on purpose: this job holds TAP_GITHUB_TOKEN, and
      # keeping that out of the job that publishes the release is the boundary.
      - name: 📥 Setup Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          sparse-checkout: .github/homebrew

      - name: 🍺 Render Cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # The bundler names the DMG, so read it off the release rather than
          # reconstructing it here.
          DMG=$(gh release view "$TAG" --json assets --jq '.assets[].name | select(endswith(".dmg"))' | head -n1)
          # Two transfers can disagree, and the cask would then contradict the
          # SHA256SUMS.txt README.md points people at.
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir .
          SHA=$(awk -v f="$DMG" '$2 == f { print $1 }' SHA256SUMS.txt)
          if [ -z "$SHA" ]; then
            echo "::error::no SHA256SUMS.txt entry for $DMG"
            exit 1
          fi
          sed -e "s/{{VERSION}}/$VERSION/g" \
              -e "s/{{SHA}}/$SHA/g" \
              -e "s/{{DMG}}/$DMG/g" \
              .github/homebrew/notras.rb.tmpl > notras.rb
          cat notras.rb

      - name: 🚰 Push To Tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/jimmy-guzman/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp notras.rb tap/Casks/notras.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/notras.rb
          if git diff --staged --quiet; then
            echo "cask unchanged; skipping commit"
          else
            git commit -m "notras ${VERSION}"
            git pull --rebase origin HEAD
            git push
          fi
